name: Bug Report
description: Create a report to help us improve hoa.moe
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: Thank you for reporting a bug! Please fill out the form below.
  - type: input
    id: url
    attributes:
      label: Page URL
      description: The page URL where the issue occurred.
      placeholder: https://hoa.moe/docs/...
    validations:
      required: false
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
      placeholder: Describe what happened...
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behavior.
      placeholder: 1. Go to '...'\n2. Click on '...'\n3. See error
    validations:
      required: true
