# 诊断完成后本文件会被删除。

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect-vps:
    uses: HITSZ-OpenAuto/hoa-api/.github/workflows/inspect-vps.yml@main
    with:
      vps_host: ${{ vars.VPS_HOST }}
