name: CI

permissions:
  contents: write
  packages: write

env:
  NEXT_TELEMETRY_DISABLED: 1
  IMAGE_NAME: ghcr.io/hitsz-openauto/hoa-fuma

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 22 * * *'
  workflow_dispatch:

jobs:
  ci:
    runs-on: blacksmith-8vcpu-ubuntu-2404
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.0
        with:
          repository: ${{ github.repository }}
          ref: main

      - name: Build content
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: make content

      - name: Remove placeholder content
        run: rm -rf content/docs content/blog content/news

      - uses: pnpm/action-setup@v6.0.9
        with:
          cache: true

      - uses: actions/setup-node@v6.4.0
        with:
          node-version-file: '.node-version'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Check format
        run: pnpm run fmt:check

      - name: Run knip
        run: pnpm run knip

      - name: Check types
        run: pnpm run types:check

      - name: Fetch external data
        run: ./scripts/fetch-data.sh

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.2.0

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build and push image
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          build-args: |
            NEXT_PUBLIC_UMAMI_SRC=${{ vars.UMAMI_SRC }}
            NEXT_PUBLIC_UMAMI_WEBSITE_ID=${{ vars.UMAMI_WEBSITE_ID }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Commit and push to production branch
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Actions"
          git add -f content/
          git commit -m "docs: update course pages" || echo "No changes to commit"
          git push origin HEAD:production --force

      - name: Tailscale
        uses: tailscale/github-action@v4.1.3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Deploy container on VPS
        uses: appleboy/ssh-action@v1.2.5
        env:
          GHCR_TOKEN: ${{ github.token }}
          FUMA_GITHUB_API_TOKEN: ${{ secrets.FUMA_GITHUB_API_TOKEN }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          passphrase: ${{ secrets.PASSPHRASE }}
          port: ${{ secrets.VPS_PORT }}
          envs: GHCR_TOKEN,FUMA_GITHUB_API_TOKEN
          script: |
            set -euo pipefail
            image_ref='${{ env.IMAGE_NAME }}:latest'
            container='hoa-fuma'
            port='${{ secrets.VPS_APP_PORT }}'

            echo "${GHCR_TOKEN}" | docker login ghcr.io -u '${{ github.actor }}' --password-stdin
            docker pull "${image_ref}"
            docker rm -f "${container}" 2>/dev/null || true
            docker run -d --name "${container}" --network proxy --restart unless-stopped -p "${port}:3000" -e GITHUB_TOKEN="${FUMA_GITHUB_API_TOKEN}" -e NODE_OPTIONS="--max-old-space-size=6144" "${image_ref}"
