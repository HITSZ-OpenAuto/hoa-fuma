name: Preview

permissions:
  contents: read
  issues: write
  pull-requests: write

on:
  issue_comment:
    types: [created]
  pull_request:
    types: [labeled, synchronize]

jobs:
  pull-request:
    if: >-
      (github.event_name == 'issue_comment' &&
        github.event.issue.pull_request &&
        github.event.comment.body == '/preview' &&
        contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)) ||
      (github.event_name == 'pull_request' &&
        ((github.event.action == 'labeled' && github.event.label.name == 'preview') ||
        (github.event.action == 'synchronize' && contains(github.event.pull_request.labels.*.name, 'preview'))))
    runs-on: ubuntu-latest
    outputs:
      head-repository: ${{ steps.pull-request.outputs.head-repository }}
      head-sha: ${{ steps.pull-request.outputs.head-sha }}
      number: ${{ steps.pull-request.outputs.number }}
    steps:
      - name: Resolve pull request
        id: pull-request
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
        run: |
          pull_request=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}")
          echo "head-repository=$(jq -r '.head.repo.full_name' <<< "$pull_request")" >> "$GITHUB_OUTPUT"
          echo "head-sha=$(jq -r '.head.sha' <<< "$pull_request")" >> "$GITHUB_OUTPUT"
          echo "number=$(jq -r '.number' <<< "$pull_request")" >> "$GITHUB_OUTPUT"

  preview:
    needs: pull-request
    if: needs.pull-request.outputs.head-repository == github.repository
    runs-on: blacksmith-8vcpu-ubuntu-2404
    env:
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.0
        with:
          repository: ${{ github.repository }}
          ref: ${{ needs.pull-request.outputs.head-sha }}

      - name: Build content
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: make content

      - uses: pnpm/action-setup@v6.1.0
        name: Install pnpm
        with:
          cache: true

      - uses: actions/setup-node@v6.4.0
        name: Set up Node
        with:
          node-version-file: '.node-version'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Check format
        run: pnpm run fmt:check

      - name: Run knip
        run: pnpm run knip

      - name: Install Vercel CLI
        run: pnpm i -g vercel@latest

      - name: Pull Vercel Environment Information
        if: ${{ env.VERCEL_TOKEN != '' }}
        run: vercel pull --yes --environment=preview --token=${{ env.VERCEL_TOKEN }}

      - name: Build Project Artifacts
        if: ${{ env.VERCEL_TOKEN != '' }}
        run: vercel build --target=preview --token=${{ env.VERCEL_TOKEN }}

      - name: Build Project Artifacts (no Vercel token)
        if: ${{ env.VERCEL_TOKEN == '' }}
        run: pnpm run build

      - name: Deploy Preview to Vercel
        id: deploy
        if: ${{ env.VERCEL_TOKEN != '' }}
        run: |
          set -o pipefail
          vercel deploy --prebuilt --target=preview --token=${{ env.VERCEL_TOKEN }} --archive=tgz 2>&1 | tee deployment.log
          node --input-type=module <<'JS' >> "$GITHUB_OUTPUT"
          import { readFileSync } from 'node:fs';

          const log = readFileSync('deployment.log', 'utf8').replace(/\u001b\[[0-9;?]*[ -/]*[@-~]/g, '');
          const inspectUrl = [...log.matchAll(/https:\/\/vercel\.com\/\S+/g)].at(-1)?.[0];
          const previewUrl = [...log.matchAll(/https:\/\/[^\s)]+\.vercel\.app/g)].at(-1)?.[0];
          if (!inspectUrl || !previewUrl) {
            throw new Error(`Unable to extract Vercel URLs. inspect=${inspectUrl ?? '<missing>'} preview=${previewUrl ?? '<missing>'}`);
          }
          console.log(`inspect_url=${inspectUrl}`);
          console.log(`preview_url=${previewUrl}`);
          JS

      - name: Comment Preview URL
        if: ${{ env.VERCEL_TOKEN != '' && steps.deploy.outputs.preview_url != '' }}
        env:
          INSPECT_URL: ${{ steps.deploy.outputs.inspect_url }}
          PREVIEW_URL: ${{ steps.deploy.outputs.preview_url }}
          COMMENT_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ needs.pull-request.outputs.number }}
        run: |
          node --input-type=module <<'JS'
          const marker = '<!-- hoa-fuma-vercel-preview -->';
          const updated = new Date().toISOString().replace('T', ' ').replace(/\.\d{3}Z$/, ' UTC');
          const body = [
            marker,
            'The latest updates on your projects.',
            '',
            '| Project | Deployment | Actions | Updated (UTC) |',
            '| --- | --- | --- | --- |',
            `| hoa-fuma | Ready | [Preview](${process.env.PREVIEW_URL}), [Inspect](${process.env.INSPECT_URL}) | ${updated} |`,
          ].join('\n');
          const [owner, repo] = process.env.GITHUB_REPOSITORY.split('/');
          const issueNumber = Number(process.env.PR_NUMBER);
          const headers = {
            Authorization: `Bearer ${process.env.COMMENT_TOKEN}`,
            Accept: 'application/vnd.github+json',
            'Content-Type': 'application/json',
            'X-GitHub-Api-Version': '2022-11-28',
          };
          const api = 'https://api.github.com';
          const commentsUrl = `${api}/repos/${owner}/${repo}/issues/${issueNumber}/comments`;
          const request = async (url, options = {}) => {
            const response = await fetch(url, { ...options, headers: { ...headers, ...options.headers } });
            if (!response.ok) {
              throw new Error(`${options.method ?? 'GET'} ${url} failed with ${response.status}: ${await response.text()}`);
            }
            return response.status === 204 ? null : response.json();
          };
          const comments = await request(`${commentsUrl}?per_page=100`);
          const comment = comments.find((item) => item.body.includes(marker));
          if (comment) {
            await request(`${api}/repos/${owner}/${repo}/issues/comments/${comment.id}`, {
              method: 'PATCH',
              body: JSON.stringify({ body }),
            });
          } else {
            await request(commentsUrl, {
              method: 'POST',
              body: JSON.stringify({ body }),
            });
          }
          JS
